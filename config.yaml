log:
  # format: json
  level: debug
database:
  sqlite:
    file: zhero.db
app:
  pagination:
    jump: 3
    defaultPageSize: 1

admin:
  server:
    port: 7080
  rdf:
    file: "rdf_schema.jsonld"
    source: "https://raw.githubusercontent.com/schemaorg/schemaorg/refs/heads/main/data/releases/29.2/schemaorg-all-https.jsonld"
  uploads:
    thumbnailSize: "360x180"
    supportedFileTypes: ["pdf", "doc", "docx", "xls", "xlsx", "csv", "txt"]
    supportedImageTYpes: ["jpg", "jpeg", "png", "gif"]

public:
  server:
    port: 8080
